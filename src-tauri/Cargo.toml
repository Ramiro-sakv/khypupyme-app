[package]
name = "khypupyme"
version = "0.3.0-beta.2"
description = "KhypuPyme beta local para Windows"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
