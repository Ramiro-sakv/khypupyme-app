[package]
name = "khypupyme"
version = "1.0.0-beta.1"
description = "KhypuPyme beta local para Windows"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
